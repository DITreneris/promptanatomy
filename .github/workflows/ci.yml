# Golden Legacy: docs/golden-legacy-standard.md — pytest, LP build, training build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-legacy:
    name: Golden Legacy
    runs-on: ubuntu-latest
    steps:
      # Hub with default GITHUB_TOKEN; private inzinerija needs a PAT
      # (Contents: Read on DITreneris/inzinerija). Secret: INZINERIJA_READ_TOKEN.
      - uses: actions/checkout@v4

      - name: Checkout private training submodule
        env:
          TOKEN: ${{ secrets.INZINERIJA_READ_TOKEN }}
        run: |
          # Secrets pasted with a trailing newline break git config keys.
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret INZINERIJA_READ_TOKEN is empty or missing. Add a fine-grained PAT (Contents: Read on inzinerija) under Settings → Secrets → Actions."
            exit 1
          fi
          code="$(curl -sS -o /tmp/inz-api.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DITreneris/inzinerija)"
          if [ "$code" != "200" ]; then
            echo "::error::PAT cannot read DITreneris/inzinerija (HTTP ${code}). Fix the token, then update secret INZINERIJA_READ_TOKEN."
            echo "401 = bad/expired token | 403 = missing permission or org SSO not authorized | 404 = no repo access / wrong resource owner"
            head -c 400 /tmp/inz-api.json || true
            echo
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/prompt-anatomy/package-lock.json

      - name: API sentry scrub tests
        run: node --test api/lib/sentry.test.js

      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Design-system token grep (LP JSX)
        working-directory: frontend
        run: |
          fail=0
          if grep -rE 'rgba\(' src/components src/pages --include='*.jsx'; then
            echo '::error::Forbidden rgba( in LP JSX — use @theme tokens' >&2
            fail=1
          fi
          if grep -rE 'text-\[[0-9]+px\]' src/components src/pages --include='*.jsx'; then
            echo '::error::Forbidden text-[NNpx] in LP JSX — use type tokens' >&2
            fail=1
          fi
          if grep -rE 'shadow-\[' src/components src/pages --include='*.jsx'; then
            echo '::error::Forbidden shadow-[ in LP JSX — use shadow-tier / named shadows' >&2
            fail=1
          fi
          exit $fail

      - name: Bundle size budget (LP critical path)
        run: node scripts/check-bundle-size.mjs

      - name: GEO static assets smoke check
        working-directory: frontend
        run: |
          test -f dist/llms-full.txt
          test -f dist/llms.txt
          grep -q 'PerplexityBot' dist/robots.txt
          grep -q 'OAI-SearchBot' dist/robots.txt
          grep -q 'facebookexternalhit' dist/robots.txt
          grep -q 'Facebot' dist/robots.txt
          grep -q 'Twitterbot' dist/robots.txt
          grep -q 'LinkedInBot' dist/robots.txt
          grep -q 'WhatsApp' dist/robots.txt
          grep -q 'Allow: /anatomy/' dist/robots.txt
          grep -q 'Disallow: /anatomy/' dist/robots.txt
          grep -q 'Tomas Staniulis' dist/llms-full.txt
          grep -q 'medium.com/@tomas.staniulis76' dist/llms-full.txt
          grep -q 'promptanatomy.site' dist/llms-full.txt
          grep -q 'promptanatomy.help' dist/llms-full.txt
          head -n 1 dist/llms.txt | grep -qx '# Prompt Anatomy'
          grep -q '^>' dist/llms.txt
          grep -q '\[Home EN\](https://www.promptanatomy.app/)' dist/llms.txt
          grep -q '\[Full LLM index\](https://www.promptanatomy.app/llms-full.txt)' dist/llms.txt
          grep -q 'promptanatomy.site' dist/llms.txt
          grep -q '## LT' dist/llms.txt
          grep -q 'DI mokymai' dist/llms.txt
          grep -q '## Optional' dist/llms.txt
          test -f dist/sitemap.xml
          [ "$(grep -c '<loc>' dist/sitemap.xml)" = "4" ]
          grep -q '<loc>https://www.promptanatomy.app/</loc>' dist/sitemap.xml
          grep -q '<loc>https://www.promptanatomy.app/lt</loc>' dist/sitemap.xml
          if grep -qE '<loc>[^<]*promptanatomy\.(site|cloud|info|space|help|ceo|pro|blog|lol)' dist/sitemap.xml; then
            echo '::error::Hub sitemap must not list spoke or discovery domains' >&2
            exit 1
          fi
          if grep -q '/anatomy/' dist/sitemap.xml; then
            echo '::error::Hub sitemap must not list /anatomy/' >&2
            exit 1
          fi
          if grep -qE '<loc>[^<]*/(success|cancel)</loc>' dist/sitemap.xml; then
            echo '::error::Hub sitemap must not list /success or /cancel' >&2
            exit 1
          fi
          test -f dist/lt.html
          grep -q '<html lang="lt">' dist/lt.html
          grep -q 'content="lt_LT"' dist/lt.html
          if grep -q 'Turn random AI chats' dist/lt.html; then
            echo '::error::EN first-byte copy leaked into dist/lt.html' >&2
            exit 1
          fi
          grep -q '<title>Prompt Anatomy – AI Training System</title>' dist/index.html

      - name: Training app install and build
        working-directory: apps/prompt-anatomy
        env:
          HUSKY: "0"
          VITE_BASE_PATH: /anatomy/
          VITE_MAX_BUILD_MODULE: "12"
        run: npm ci && npm run build:corporate12

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend install and tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
